model:
  name: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 256
  timeout_seconds: 60
  max_retries: 3
  concurrency: 4
embedding:
  model_id: models/embeddings/bge-m3
  device: cpu
  batch_size: 32
retrieval:
  enabled: true
  k: 5
  cross_lingual: true
experiment:
  train_paths: [datasets/asean_sentiment/vietnamese/train.json]
  dev_paths: [datasets/asean_sentiment/vietnamese/dev.json]
  test_paths: [datasets/asean_sentiment/vietnamese/test.json]
  output_root: outputs
  train_batch_size: 8
  checkpoints: [100, 500, 1000]
  seed: 42

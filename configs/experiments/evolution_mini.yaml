model:
  name: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60
  max_retries: 3
  concurrency: 4

embedding:
  model_id: models/embeddings/bge-m3
  device: cpu
  batch_size: 32

retrieval:
  enabled: true
  k: 5
  minimum_reliability: 0.0
  semantic_weight: 1.0
  language_weight: 0.1
  source_weight: 0.05
  reliability_weight: 0.1
  cross_lingual: true

attribution:
  enabled: true
  llm_for_errors_only: true
  max_retries: 2

generalization:
  enabled: true
  merge_similarity: 0.85
  minimum_support: 2
  minimum_batches: 2
  maximum_contradiction_ratio: 0.20
  minimum_active_reliability: 0.60

experiment:
  train_paths:
    - datasets/mini_dataset/vietnamese/train.json
  dev_paths:
    - datasets/mini_dataset/vietnamese/dev.json
  test_paths:
    - datasets/mini_dataset/vietnamese/test.json
  output_root: outputs
  train_batch_size: 8
  checkpoints: [50, 100]
  seed: 42
  use_cache: true

model:
  name: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60
  max_retries: 3
  concurrency: 4
embedding:
  model_id: models/embeddings/bge-m3
  device: cpu
  batch_size: 32
retrieval:
  enabled: false
experiment:
  train_paths: []
  dev_paths: []
  test_paths: [datasets/asean_sentiment/vietnamese/test.json]
  output_root: outputs
  train_batch_size: 8
  checkpoints: []
  seed: 42

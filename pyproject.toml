[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "asean-sentiment-agent"
version = "0.1.0"
description = "A tested research framework for self-evolving multilingual sentiment agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-huggingface>=1,<2",
  "langchain-openai>=0.3,<2",
  "matplotlib>=3.11.1",
  "modelscope>=1.31,<2",
  "numpy>=2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5,<6",
  "typer>=0.12,<1",
]

[project.scripts]
sentiment-agent = "sentiment_agent.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["sentiment_agent"]

[tool.coverage.report]
show_missing = true
